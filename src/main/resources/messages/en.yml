  - "<gold>Your town's reputation scores:</gold>"
reputation-info-empty: "<gray><em>Your town doesn't have any reputation with anyone</em></gray>"
reputation-info-entry: "<gray><gold><bold>{1} {2}</bold></gold>: {3}</gray>"
reputation-entry-footer:
  - '<gray>Type "/t reputation <name>" to see details.</gray>'
  - "<error><strikethrough>+|✦                                 +✦+                                 |✦+</strikethrough></error>"

reputation-details-header:
  - "<error><strikethrough>+|✦                         </strikethrough><bold>[<white> Reputation </white>]</bold><strikethrough>                          |✦+</strikethrough></error>"
  - "<gold>Your town's reputation with {1}:</gold>"
reputation-details-empty: "<gray><em>You don't have any reputation with {1}.</em></gray>"
reputation-details-entry: "<gray><bold>{1}</bold>: {2} ({3})</gray>"
reputation-details-footer:
  - "<error><strikethrough>+|✦                                 +✦+                                 |✦+</strikethrough></error>"

opinion-details-header: "<error><strikethrough>+|✦                           </strikethrough><bold>[<white> Opinion </white>]</bold><strikethrough>                            |✦+</strikethrough></error><br><gold>{1}'s opinion of {2}:</gold>"
opinion-details-empty: "<gray><em>They don't have any opinion of {1}.</em></gray>"
opinion-details-entry: "<gray><bold>{1}</bold>: {2} ({3})</gray>"
opinion-details-footer: "<error><strikethrough>+|✦                                 +✦+                                 |✦+</strikethrough></error>"
