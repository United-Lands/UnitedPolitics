prefix: "<bold><error>U</error><white>L</white> Politics <dark_gray>» </dark_gray></bold>"
reload: "<green>Plugin reloaded.</green>"
forced-new-day: "<green>Forced exeution of new day.</green>"

reputation-changed: "<body><label><b>{1}</b></label> <dark_gray>-></dark_gray> <label><b>{2}</b></label>: {3} ({4}) <dark_gray>|</dark_gray> New total: {5}</body>"

errors:
  general:
    generic: <error>An error occuerror. Please contact an admin or open a ticket on the discord.unitedlands.net.</error>
    geopol-obj-not-found: "<error>'{1}' not found.</error>"
    number-format-error: "<error>'{1}' is not a valid number.</error>"
    db-save-error: "<error>Error while saving.</error>"
    no-town-resident: "<error>You're not a resident in any town.</error>"
    no-nation-resident: "<error>You're not a resident of a country.</error>"
    no-rank: "<error>You don't have the necessary rank to use this.</error>"
    player-not-found: "<error>Citizen {1} not found.</error>"
  reputation:
    no-record: "<error>Reputation record not found, use create first.</error>"
    existing-record: "<error>A record with that key already exists, use set, add or remove instead."
  actorprofile:
    no-profile: "<error>This actor doesn't have a profile yet, use <em>create</em> to create one."
    existing-record: "<error>A profile for that actor already exists."
    reaction-exists: "<error>There aready is a record with this event key and reaction."
    reaction-missing: "<error>No record with the given event key found."
    rival-exists: "<error>There aready is a record with this rival."
    rival-missing: "<error>No record with the given rival found."
    partner-exists: "<error>There aready is a record with this partner."
    partner-missing: "<error>No record with the given partner found."
    dungeon-not-found: "<error>No dungeon with that name found."
    dungeon-exists: "<error>There aready is a record with this dungeon."
    dungeon-missing: "<error>No record with the given dungeon found."
  treaty:
    unknown-type: "<error>Unknown treaty type: {1}"
  opinion:
    no-town: '<error>You must be in a town to use this command without a target. Use "/opinion <town/nation> <target_town/target_nation>"</error>'
    target-not-found: "<error>Target {1} not found.</error>"
  pay:
    same-entity: <error>Source and target can't be the same.</error>
    insufficient-funds: <error>Not enough money.</error>
  embargo:
    exists: <error>The target country is already on the embargo list.</error>
    not-embargoed: <error>The target country is not on the embargo list.</error>
    same-country: <error>Source and target country are the same.</error>
  ambassador:
    citizen-not-in-country: <error>The citizen is not part a country.</error> 
    citizen-in-target-country: <error>The citizen is a member of the target country.</error> 
    already-has-ambassador: <error>{1} already has an ambassador in {2}.</error> 
    citizen-is-ambassador: <error>{1} is already an ambassador.</error> 
    citizen-is-not-ambassador: <error>{1} is not an ambassador.</error> 

success:
  reputation:
    create: "<dark_green>Created reputation entry of {1} for {2} with {4} for key {3}."
    add: "<dark_green>Added {1} to reputation of {2} with {4} for key {3}."
    set: "<dark_green>Set reputation of {1} with {2} to {3} for key {4}."
    remove: "<dark_green>Removed reputation of {1} with {2} for key {3}."
  actorprofile:
    create: "<dark_green>Created actor profile for {1}."
    saved: "<dark_green>Saved changes for {1}."
  treaty:
    create: "<dark_green>Created {1} treaty named {2}."
    broadcast-create: "<aqua>{1} created a new {2} treaty called <b>{3}</b>!"
    broadcast-join: "<aqua>{1} just joined <b>{2}</b>!"
  pay:
    tribute: <success>Successfully paid tribute to {2}</success>
    propaganda: <success>Successfully paid propaganda against {2}</success>
  embargo:
    added: <success>Added country {1} to embargo list of {2}.</success>
    removed: <success>Removed country {1} from embargo list of {2}.</success>
  ambassador:
    set: <success>Assigned {1} as an ambassador of {2} to {3}.</success>
    removed: <success>Removed {1} as an ambassador of {2} in {3}.</success>


actorprofile:
  header: "<bold><gold>{1}'s Actor Profile</gold></bold>"
  reactions-header: "<gray>[ Reactions ]<st>                                       </st></gray>"
  reactions-line: "<gray>{1} -> <aqua>{2}</aqua>: {3}</gray>"
  rivals-header: "<error>[ Rivals ]<st>                                         </st></error>"
  rivals-line: "<error>{1}</error>"
  partners-header: "<green>[ Partners ]<st>                                       </st></green>"
  partners-line: "<green>{1}</green>"
  hostiledungeons-header: "<dark_error>[ Hostile Dungeons ]<st>                                </st></dark_error>"
  hostiledungeons-line: "<dark_error>{1}</dark_error>"
  friendlydungeons-header: "<dark_green>[ Friendly Dungeons ]<st>                                </st></dark_green>"
  friendlydungeons-line: "<dark_green>{1}</dark_green>"

embargo:
  confirm: "<warn>Issuing a trade embargo against {1} will block their players from using any shops in your country, and will lead to a significant reputation loss with them. Continue?</warn>"
  broadcast: <broadcast>{1} has issued a trade embargo against {2}.</broadcast>
  broadcast-lifted: <broadcast>{1} has lifted the trade embargo against {2}.</broadcast>
  list-header: <body><label><b>{1}</b></label> active embargo list:</body>
  entry: <body>- {1}</body> 
  empty: <body><i>No active embargoes found.</i></body>
  active: Your country has been put on a trade embargo by {1}. You are not allowed to use their shops until the embargo is lifted.

ambassador:
  confirm-sender: "<body>Sending an ambassador to </b>{1}</b> will improve their opinion of your country over time and will cost {2} per day.<br><br>Accept?</body>"
  confirm-target: "<body><b>{1}</b> wishes to establish diplomatic relations by sending an ambassador to your country. This will improve your opinion of them over time.<br><br>You may chose to evict the ambassador at any time, at the cost of severe damage to your reputation.<br><br>Accept?</body>"
  confirm-recall: "<warn>Recalling your ambassador from <b>{1}</b> will severely hurt their opinion of you. Continue?</warn>"
  recall: "<body><b>{1}</b> wishes to establish diplomatic relations by sending an ambassador to your country. This will improve your relations with them over time.<br><br>You may chose to evict the ambassador at any time, at the cost of severe damage to your reputation.<br><br>Accept?</body>"
  broadcast: <broadcast>{1} sent an ambassador to {2}.</broadcast>
  broadcast-recalled: <broadcast>{1} recalled their ambassador from {2}.</broadcast>
  broadcast-evicted: <broadcast>{1} has evicted the ambassador of {2}.</broadcast>
  list-header: <body><label><b>{1}</b></label>'s ambassadors:</body>
  entry: "<body>- <label>{1}</label>: {2}</body>"
  empty: <body><i>No ambassadors found.</i></body>

tribute:
  success: "<green>You've paid a tribute of {1} to {2}.</green>"
  same-entity: "<error>You can't pay tribute to yourself.</error>"
  is-own-nation: "<error>You can't pay tribute to your own nation.</error>"
  same-nation: "<error>You can't pay tribute to a town in your own nation.</error>"
  insufficient-funds: "<error>You don't have enough money.</error>"
  error: "<error>Something went wrong while trying to pay {1} to {2}. Please contact an Admin or open a support ticket.</error>"

